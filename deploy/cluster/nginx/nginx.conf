# Campus Repair Assistant — Nginx (Windows 本机) 主配置
# 目标位置：<Nginx 安装目录>\conf\nginx.conf（替换默认文件）
# 常用命令（在 Nginx 安装目录执行）：
#   nginx.exe -t            校验配置
#   start nginx.exe         启动
#   nginx.exe -s reload     重载配置
#   nginx.exe -s quit       优雅退出
#
# 注意：root 路径使用 Windows 风格但写作正斜杠（nginx 规范）；
#       每台机器请把 root 改成本机的 frontend-dist 实际路径。

worker_processes  auto;
error_log         logs/nginx-error.log warn;
pid               logs/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 访问日志记录上游节点与耗时：发布验证、负载分布观察、排障都用它
    log_format campus_main '$remote_addr - [$time_local] "$request" '
                           '$status $body_bytes_sent '
                           'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log logs/campus-repair.access.log campus_main;

    sendfile            on;
    keepalive_timeout   65;
    server_tokens       off;

    # ===== 双 Tomcat 实例：默认轮询（round-robin）=====
    # 不写 least_conn / ip_hash：项目用 JWT 无状态认证，节点间无会话依赖。
    # max_fails/fail_timeout 是被动健康检查：连续 3 次失败后该节点暂停 30 秒。
    upstream campus_backend {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    server {
        # 对局域网开放：全组/教师通过 http://<项目服务器IP>/ 访问
        listen      80;
        server_name _;

        # 前端构建产物目录（每次发布执行 npm run build 后替换内容）
        root "D:/campus/frontend-dist";
        index index.html;

        # 必须 >= Spring 的 50MB multipart 上限，否则大文件先在 Nginx 层 413
        client_max_body_size 50m;

        # SPA history 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存；^~ 保证 /api/ 不被正则规则截走
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location ^~ /api/ {
            # 末尾不带 URI：/api/... 原样转发到 Tomcat
            proxy_pass http://campus_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 只对幂等请求自动重试另一实例；不加 non_idempotent，避免 POST 重复建单
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }
    }
}
