# Campus Repair Assistant — Nginx 站点与负载均衡配置
# 目标位置：/etc/nginx/conf.d/campus-repair.conf
# 启用前删除默认站点：sudo rm -f /etc/nginx/sites-enabled/default
# 检查并重载：sudo nginx -t && sudo systemctl reload nginx

# 访问日志包含上游地址与耗时，便于验证轮询和故障转移
log_format campus_main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

upstream campus_backend {
    # 不写 least_conn / ip_hash，默认即轮询（round-robin）
    server 192.168.56.102:8080 max_fails=3 fail_timeout=30s;
    server 192.168.56.103:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name 192.168.56.101;

    root /var/www/campus-repair;
    index index.html;

    # 必须 >= Spring 的 50MB，否则大文件在 Nginx 层就被 413
    client_max_body_size 50m;

    access_log /var/log/nginx/campus-repair.access.log campus_main;
    error_log  /var/log/nginx/campus-repair.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存；^~ 保证 /api/ 不被下面的正则规则截走
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /api/ {
        # 末尾没有 URI，原样转发 /api/...
        proxy_pass http://campus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 只对幂等请求自动重试；不要加 non_idempotent，避免 POST 重复写入
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        # 演示用：响应头显示实际命中的节点，重试时可能显示 "ip1, ip2"
        add_header X-Upstream $upstream_addr always;
    }
}
