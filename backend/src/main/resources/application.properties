# 应用名
spring.application.name=AI-Training-Evaluation

# 服务端口
server.port=8080

# 数据库配置（根据本机MySQL修改用户名密码）
spring.datasource.url=jdbc:mysql://localhost:3306/training_evaluation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 文件上传大小限制
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 文件存储路径
file.upload-dir=uploads/
