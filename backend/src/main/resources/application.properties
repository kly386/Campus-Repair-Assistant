# 应用名
spring.application.name=Campus-Repair-Assistant

# 服务端口
server.port=8080

# CORS 白名单（逗号分隔，仅放行所列源，务必在部署前补充线上地址）
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# 数据库配置（根据本机MySQL修改用户名密码）
spring.datasource.url=jdbc:mysql://localhost:3306/campus_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 文件上传大小限制
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 文件存储路径
file.upload-dir=uploads/