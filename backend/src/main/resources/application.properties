# ???
spring.application.name=Campus-Repair-Assistant

# ????
server.port=8080

# CORS ?????????????????????????????
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# 数据库配置（本地默认仅供开发，正式环境必须通过环境变量 DB_USERNAME / DB_PASSWORD 覆盖，勿将真实密码写进仓库）
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/campus_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ????????
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ??????
file.upload-dir=uploads/
