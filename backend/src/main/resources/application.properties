# 应用名
spring.application.name=Campus-Repair-Assistant

# 服务端口（8080 与食堂系统冲突，改 8081）
server.port=8081

# CORS 白名单（逗号分隔，仅放行所列源，务必在部署前补充线上地址）
# 本地 Vite dev 常因端口顺延到 5174/5175，一并放行
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175

# 数据库配置（本地默认仅供开发，正式环境必须通过环境变量 DB_USERNAME / DB_PASSWORD 覆盖，勿将真实密码写进仓库）
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/campus_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置：建表/变更统一走 docs/sql/*.sql（应用账号无 DDL 权限，也避免 update 模式误改字段类型）
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 文件上传大小限制
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# MinIO（文件模块，S3 兼容开源对象存储，本机 Docker 容器 campus-minio）。
# 账号与容器 MINIO_ROOT_USER/PASSWORD 保持一致（admin / ChangeMe_123）；
# 演示环境即装即用；生产/局域网演示时可用环境变量覆盖 endpoint（如本机 IP）。
file.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
file.minio.bucket=${MINIO_BUCKET:campus-repair}
file.minio.access-key=${MINIO_ACCESS_KEY:admin}
file.minio.secret-key=${MINIO_SECRET_KEY:ChangeMe_123}
# 下载签名 URL 有效期（秒），默认 30 分钟
file.minio.url-expire-seconds=1800

# 文件存储路径
file.upload-dir=uploads/

# ===== 登录鉴权 =====
# JWT 密钥（至少 32 字节；生产用环境变量覆盖，勿写仓库固定值）
app.jwt.secret=${JWT_SECRET:campus-repair-jwt-secret-2026-keep-it-secret!}
# token 有效期（分钟）
app.jwt.expire-minutes=120
# 短信模拟开关：true 时验证码随响应返回（演示/联调）；生产 false
app.auth.sms-mock=true