spring.config.import=optional:classpath:application-local.properties

# 应用名
spring.application.name=Campus-Repair-Assistant

# 服务端口（8080 与食堂系统冲突，改 8081）
server.port=8081

# 生产经 Nginx 转发时，由框架统一处理可信代理的 X-Forwarded-* 头
server.forward-headers-strategy=framework

# CORS 白名单（逗号分隔，仅放行所列源）
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}

# 数据库配置（本地默认仅供开发，正式环境通过环境变量覆盖）
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/campus_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA：建表/变更统一执行 docs/sql/*.sql，不使用 update 自动改表
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 文件上传大小限制
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# MinIO / S3 兼容对象存储
file.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
file.minio.bucket=${MINIO_BUCKET:campus-repair}
file.minio.access-key=${MINIO_ACCESS_KEY:admin}
file.minio.secret-key=${MINIO_SECRET_KEY:ChangeMe_123}
file.minio.url-expire-seconds=1800
file.upload-dir=uploads/

# ===== 统一身份认证 / JWT =====
# HS256 密钥至少 32 字节，生产必须通过 JWT_SECRET 覆盖
app.jwt.secret=${JWT_SECRET:campus-repair-jwt-secret-2026-keep-it-secret!}
# access Token 短有效期；refresh Token 长有效期
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:30}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:7}

# ===== 登录风控 =====
# 密码连续错误 5 次锁定 10 分钟；锁定期间四种登录方式全部拒绝
app.auth.max-login-fail=${AUTH_MAX_LOGIN_FAIL:5}
app.auth.lock-minutes=${AUTH_LOCK_MINUTES:10}

# ===== Spug 短信 =====
# 本地可保持 mock=true；生产设置 SMS_MOCK=false 并配置 SPUG_SMS_URL
app.sms.mock=${SMS_MOCK:true}
app.sms.spug.url=${SPUG_SMS_URL:}
app.sms.spug.number=${SPUG_SMS_EXPIRE_NUMBER:5}

# ===== 邮箱验证码（本地默认模拟） =====
app.email.mock=${EMAIL_MOCK:true}
app.email.from=${MAIL_FROM:no-reply@campus-repair.local}
# 默认 host 只为让 Spring 创建 JavaMailSender；mock=true 时不会真正连接 SMTP
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# ===== 微信扫码登录（本地默认模拟） =====
app.wechat.mock=${WECHAT_MOCK:true}
app.wechat.app-id=${WECHAT_APP_ID:}
app.wechat.app-secret=${WECHAT_APP_SECRET:}
app.wechat.redirect-uri=${WECHAT_REDIRECT_URI:}
app.wechat.mock-openid=${WECHAT_MOCK_OPENID:wx_mock_demo_user}

# ===== RAG 向量检索（DashScope 文本向量，负责人：闵娟） =====
# key 只经环境变量注入（.env 的 DASHSCOPE_API_KEY），未配置时自动降级 LIKE 检索
dashscope.api-key=${DASHSCOPE_API_KEY:}
dashscope.embedding.model=${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
dashscope.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}

# ===== AI 公共封装（多模态报修解析与 RAG 问答共用，负责人：伍梦圆） =====
# OpenAI 兼容协议：DashScope(qwen compatible-mode)/DeepSeek/GLM/Moonshot 等均可直接换 base-url+model
app.ai.base-url=${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:qwen-vl-plus}
app.ai.timeout-ms=${AI_TIMEOUT_MS:30000}
# mock=true 或未配置 key 时走本地模拟，不产生任何外呼（联调/演示零成本）
app.ai.mock=${AI_MOCK:true}
# 单次解析最多携带的图片数
app.ai.max-images=3
