# ===== 生产/集群环境（外部 Tomcat 11 部署） =====
# 启用方式：在 Tomcat 的 bin/setenv.sh 中 设置 SPRING_PROFILES_ACTIVE=prod。
#
# 注意：外部 Tomcat 部署时以下配置不生效：
#   - server.port               HTTP 端口由 conf/server.xml 的 Connector 决定
#   - server.servlet.context-path  上下文路径由 WAR 文件名决定（本项目部署为 ROOT.war）
# 本文件通过环境变量覆盖，避免把生产密码写进仓库。

# ===== 数据源（读写分离） =====
# 集群生产环境必须开启路由：写与默认访问走主库，@Slave 标注的只读方法走从库
app.datasource.routing-enabled=true

# 主库（写 + 默认访问）
# 注意：直接绑定 HikariDataSource 时属性名为 jdbc-url（对应 setJdbcUrl），不是 url
spring.datasource.master.jdbc-url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/campus_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.master.username=${DB_USERNAME:campus}
spring.datasource.master.password=${DB_PASSWORD:ChangeMe_123}
spring.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver
# 主/从各 10 连接，两 Tomcat 节点合计 40，MySQL max_connections=200 余量充足
spring.datasource.master.maximum-pool-size=10
spring.datasource.master.minimum-idle=5
spring.datasource.master.connection-timeout=30000

# 从库（只读）；jdbc-url 留空则读操作自动回落主库
# Docker 方案：主 localhost:3306 / 从 localhost:3307（DB_SLAVE_HOST/DB_SLAVE_PORT 可覆盖）
# 应用账号 campus 需在从库单独创建（用户表不随业务库复制），见 docs/MySQL读写分离部署文档.md
spring.datasource.slave.jdbc-url=jdbc:mysql://${DB_SLAVE_HOST:localhost}:${DB_SLAVE_PORT:3307}/campus_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.slave.username=${DB_USERNAME:campus}
spring.datasource.slave.password=${DB_PASSWORD:ChangeMe_123}
spring.datasource.slave.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.slave.maximum-pool-size=10
spring.datasource.slave.minimum-idle=5
spring.datasource.slave.connection-timeout=30000

# 集群必须使用 validate：绝不能两个节点同时执行 update 改表
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 上传大小限制（Nginx 侧 client_max_body_size 必须 >= 50m）
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 外部 Tomcat 下相对路径会落到进程工作目录，必须使用绝对路径
file.upload-dir=${UPLOAD_DIR:/opt/campus-repair/uploads}

# 经 Nginx 同源访问时不会触发 CORS；保留该配置仅用于直连调试
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://192.168.56.101}

# 让 request.getScheme()/客户端 IP 正确识别 Nginx 转发的 X-Forwarded-*
server.forward-headers-strategy=framework
