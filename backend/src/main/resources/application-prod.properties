# ===== 生产/集群环境（外部 Tomcat 11 部署） =====
# 启用方式：在 Tomcat 的 bin/setenv.sh 中设置 SPRING_PROFILES_ACTIVE=prod。
#
# 注意：外部 Tomcat 部署时以下配置不生效：
#   - server.port               HTTP 端口由 conf/server.xml 的 Connector 决定
#   - server.servlet.context-path  上下文路径由 WAR 文件名决定（本项目部署为 ROOT.war）
# 本文件通过环境变量覆盖，避免把生产密码写进仓库。

# 数据库连接（默认指向 VM1 的 MySQL）
spring.datasource.url=jdbc:mysql://${DB_HOST:192.168.56.101}:${DB_PORT:3306}/campus_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:campus}
spring.datasource.password=${DB_PASSWORD:ChangeMe_123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 每个节点 10 个连接，两节点共 20，MySQL max_connections=200 余量充足
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# 集群必须使用 validate：绝不能两个节点同时执行 update 改表
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 上传大小限制（Nginx 侧 client_max_body_size 必须 >= 50m）
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 外部 Tomcat 下相对路径会落到进程工作目录，必须使用绝对路径
file.upload-dir=${UPLOAD_DIR:/opt/campus-repair/uploads}

# 经 Nginx 同源访问时不会触发 CORS；保留该配置仅用于直连调试
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://192.168.56.101}

# 让 request.getScheme()/客户端 IP 正确识别 Nginx 转发的 X-Forwarded-*
server.forward-headers-strategy=framework
