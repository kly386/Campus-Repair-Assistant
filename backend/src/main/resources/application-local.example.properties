# 复制本文件为 application-local.properties 后填写真实值。
# application-local.properties 已被 .gitignore 忽略，不会提交到 Git。

app.email.mock=false
app.email.from=YOUR_EMAIL@example.com
spring.mail.host=smtp.example.com
spring.mail.port=465
spring.mail.username=YOUR_EMAIL@example.com
spring.mail.password=YOUR_SMTP_AUTH_CODE
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

app.sms.mock=false
app.sms.spug.url=https://push.spug.cc/sms/YOUR_TEMPLATE_TOKEN
app.sms.spug.number=5